# Default versions for heic-fix.sh.
#
# Set any value to "latest" to resolve the newest stable tag at run time.
# Environment variables of the same name override these values.
#
# LIBHEIF_VERSION is pinned because v1.23.7 is the version verified against an
# iPhone 15 Pro Max / iOS 18.0 sample. Anything below MIN_LIBHEIF is refused.
LIBHEIF_VERSION=v1.23.7
LIBDE265_VERSION=latest
IMAGEMAGICK_VERSION=latest
IMAGICK_VERSION=latest

# libheif v1.18.2 is the first release that handles iOS 18 HEIF metadata
# (tmap tone-map items and the extra auxiliary images).
MIN_LIBHEIF=1.18.2
