name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -x heic-fix.sh tests/*.sh

  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Docusaurus site
        run: npm run build
      - name: Check local search wiring
        run: bash scripts/check-docs-search.sh
      - name: Check local links
        run: |
          docker run --rm \
            -v "$PWD:/input" \
            lycheeverse/lychee:latest \
            --offline --no-progress /input/README.md /input/docs

  container-test:
    name: Ubuntu ${{ matrix.ubuntu }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            php: "8.3"
          - ubuntu: "22.04"
            php: "8.5"
          - ubuntu: "24.04"
            php: "8.3"
    steps:
      - uses: actions/checkout@v4
      - name: Run container test
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -e PHP_VER="${{ matrix.php }}" \
            -e JOBS=4 \
            "ubuntu:${{ matrix.ubuntu }}" \
            bash /repo/tests/run-container-test.sh

  plugin:
    name: HEIC Fix Monitor plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sodium, zip
          tools: composer, phpcs
          coverage: none
      - name: Install WordPress Coding Standards
        run: |
          composer global config --no-plugins \
            allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction \
            wp-coding-standards/wpcs \
            dealerdirect/phpcodesniffer-composer-installer
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.config/composer/vendor/bin" >> "$GITHUB_PATH"
      - name: Run plugin CI
        run: bash wordpress-plugin/heic-fix-monitor/tests/ci-plugin.sh
      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: heic-fix-monitor-plugin
          path: wordpress-plugin/heic-fix-monitor/artifacts/heic-fix-monitor.zip
          if-no-files-found: error
