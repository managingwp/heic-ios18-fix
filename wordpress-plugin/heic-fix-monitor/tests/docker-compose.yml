services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    ports:
      - "18080:80"
    volumes:
      - wp_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/heic-fix-monitor
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      timeout: 5s
      retries: 30

  cli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/heic-fix-monitor

  db-ms:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress-ms:
    image: wordpress:php8.2-apache
    depends_on:
      db-ms:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-ms:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    ports:
      - "18081:80"
    volumes:
      - wp_ms_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/heic-fix-monitor
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      timeout: 5s
      retries: 30

  cli-ms:
    image: wordpress:cli-php8.2
    depends_on:
      db-ms:
        condition: service_healthy
      wordpress-ms:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-ms:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    user: "33:33"
    volumes:
      - wp_ms_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/heic-fix-monitor

  db-zip:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress-zip:
    image: wordpress:php8.2-apache
    depends_on:
      db-zip:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-zip:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    ports:
      - "18082:80"
    volumes:
      - wp_zip_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      timeout: 5s
      retries: 30

  cli-zip:
    image: wordpress:cli-php8.2
    depends_on:
      db-zip:
        condition: service_healthy
      wordpress-zip:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-zip:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    user: "33:33"
    volumes:
      - wp_zip_data:/var/www/html
      - ../artifacts:/artifacts:ro
      - ./:/hfm-tests:ro

volumes:
  wp_data:
  wp_ms_data:
  wp_zip_data:
